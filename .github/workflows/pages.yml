# Publie ce dépôt sur GitHub Pages : https://hospiceantonio.github.io/kingfood/
#
# Se déclenche à chaque modification sur la branche main — donc aussi quand on
# remplace menu.json pour mettre le menu à jour. Vérifie d'abord que menu.json
# est lisible : un fichier cassé n'est jamais publié, l'ancien menu reste en ligne.
name: Publier le menu sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier menu.json avant publication
        run: |
          node -e "
            const m = JSON.parse(require('fs').readFileSync('menu.json', 'utf8'));
            if (!Array.isArray(m.salles) || !m.salles.length) throw new Error('menu.json ne contient aucune carte');
            const n = m.salles.reduce((t, s) => t + s.categories.reduce((u, c) => u + c.items.length, 0), 0);
            console.log('menu.json valide —', m.salles.length, 'carte(s),', n, 'articles');
          "

      - name: Assembler le site
        run: rsync -a --exclude .git --exclude .github --exclude _site ./ _site/ && ls _site

      - name: Configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # active Pages tout seul au premier passage si possible

      - name: Préparer les fichiers
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4
